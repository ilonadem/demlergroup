<!doctype html>

    <!-- Header gets injected here -->

    <main>
      <section class="people-section">

              <figure class="varia-carousel-slide">
                <img src="assets/images/group-varia/aaron_eugene_2.webp" alt="Eugene presenting a gift to Aaron" width="1200" height="1600" loading="lazy" />
                <figcaption></figcaption>
              </figure>
              <figure class="varia-carousel-slide">
                <img src="assets/images/group-varia/aaron_card.webp" alt="Illustrated card made for Aaron" width="1122" height="1402" loading="lazy" />

            </div>
            <button class="varia-carousel-button varia-carousel-button--next" type="button" aria-label="Next Aaron photo" data-carousel-next>›</button>

          <div class="varia-carousel" data-carousel>
            <button class="varia-carousel-button varia-carousel-button--previous" type="button" aria-label="Previous Alex photo" data-carousel-previous>‹</button>
            <div class="varia-carousel-track" tabindex="0" aria-label="Alex photo gallery" data-carousel-track>
              <figure class="varia-carousel-slide">
                <img src="assets/images/group-varia/alex_defence.webp" alt="Alex presenting during his defence" width="1800" height="1350" loading="lazy" />
                <figcaption></figcaption>
              </figure>
              <figure class="varia-carousel-slide">
                <img src="assets/images/group-varia/alex_apero_1.webp" alt="Colleagues gathered for Alex's apéro" width="1800" height="1350" loading="lazy" />
                <figcaption></figcaption>
              </figure>
              <figure class="varia-carousel-slide">
                <img src="assets/images/group-varia/alex_card.webp" alt="Illustrated card made for Alex" width="1800" height="2400" loading="lazy" />
                <figcaption>A commemorative graduation card from the group</figcaption>
              </figure>
            </div>
            <button class="varia-carousel-button varia-carousel-button--next" type="button" aria-label="Next Alex photo" data-carousel-next>›</button>
            <p class="varia-carousel-status" aria-live="polite"><span data-carousel-current>1</span> / 3</p>

        <figure style="max-width: 900px; margin: 0 auto 40px; text-align: center;">
          <img src="assets/images/group-varia/demler_munich_symposium_srgb.webp" alt="A one-day symposium with our collaborators" loading="lazy" style="width: 80%; height: auto; border-radius: 10px; background: #f7f9fc; box-shadow: 0 0 0 1px #d4deef; padding: 10px; box-sizing: border-box;" />

        </figure>

        </figure>
        <figure style="max-width: 900px; margin: 0 auto; text-align: center;">
          <img src="assets/images/group-varia/group-dinner.webp" alt="Demler group dinner, December 2025" loading="lazy" style="width: 80%; height: auto; border-radius: 10px; background: #f7f9fc; box-shadow: 0 0 0 1px #d4deef; padding: 10px; box-sizing: border-box;" />

    </main>

    <footer>© 2025 Demler group; original design by I. Demler</footer>

    <script>
      fetch("header.html")
        .then((response) => response.text())
        .then((html) => {
          const headerContainer = document.getElementById("site-header");
          headerContainer.innerHTML = html;

          const currentPath = window.location.pathname.replace(/\/$/, "") || "/";
          const currentPage = currentPath === "/" ? "index.html" : currentPath.split("/").pop();
          const links = headerContainer.querySelectorAll("a");

          links.forEach((link) => {
            const href = link.getAttribute("href") || "";
            const linkPage = href === "/" ? "index.html" : href.replace(/^\//, "");
            if (linkPage === currentPage) {
              link.classList.add("active");
            }
          });
        });

      document.querySelectorAll("[data-carousel]").forEach((carousel) => {
        const track = carousel.querySelector("[data-carousel-track]");
        const slides = Array.from(track.querySelectorAll(".varia-carousel-slide"));
        const currentSlide = carousel.querySelector("[data-carousel-current]");
        let currentIndex = 0;
        let scrollFrame;

        const updateStatus = (index) => {
          currentIndex = index;
          currentSlide.textContent = String(index + 1);
        };

        const showSlide = (index) => {
          const wrappedIndex = (index + slides.length) % slides.length;
          track.scrollTo({
            left: slides[wrappedIndex].offsetLeft,
            behavior: "smooth",
          });
          updateStatus(wrappedIndex);
        };

        carousel.querySelector("[data-carousel-previous]").addEventListener("click", () => {
          showSlide(currentIndex - 1);
        });

        carousel.querySelector("[data-carousel-next]").addEventListener("click", () => {
          showSlide(currentIndex + 1);
        });

        track.addEventListener("keydown", (event) => {
          if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
            event.preventDefault();
            showSlide(currentIndex + (event.key === "ArrowLeft" ? -1 : 1));
          }
        });

        track.addEventListener("scroll", () => {
          window.cancelAnimationFrame(scrollFrame);
          scrollFrame = window.requestAnimationFrame(() => {
            const nearestIndex = slides.reduce((bestIndex, slide, index) => {
              const bestDistance = Math.abs(slides[bestIndex].offsetLeft - track.scrollLeft);
              const currentDistance = Math.abs(slide.offsetLeft - track.scrollLeft);
              return currentDistance < bestDistance ? index : bestIndex;
            }, 0);
            updateStatus(nearestIndex);
          });
        });
      });
    </script>
  </body>
</html>
