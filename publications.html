<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Publications</title>

    <link rel="stylesheet" href="assets/styles.css" />

    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["\\(", "\\)"]]
        }
      };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  </head>

  <body>
    <div id="site-header"></div>

    <main>
      <section class="publications-section">
        <h1>Publications</h1>

        <p class="publications-note">
          For a complete and up-to-date list, see the
          <a href="https://scholar.google.com/citations?user=0qjME1gAAAAJ" target="_blank">
            Google Scholar
          </a>.
        </p>

        <!-- Legacy publication list gets injected here -->
        <div id="publications-list"></div>
      </section>
    </main>

    <footer>© 2025 Demler group; original design by I. Demler</footer>

    <script>
      fetch("header.html")
        .then((r) => r.text())
        .then((html) => {
          const h = document.getElementById("site-header");
          h.innerHTML = html;

          const currentPath = window.location.pathname.replace(/\/$/, "") || "/";
          const currentPage = currentPath === "/" ? "index.html" : currentPath.split("/").pop();
          h.querySelectorAll("a").forEach((a) => {
            const href = a.getAttribute("href") || "";
            const linkPage = href === "/" ? "index.html" : href.replace(/^\//, "");
            if (linkPage === currentPage) {
              a.classList.add("active");
            }
          });
        });

      const publicationsVersion = "2026-05-11-publications-layout";

      fetch(`publications-legacy.html?v=${publicationsVersion}`)
        .then(r => r.text())
        .then(html => {
          const temp = document.createElement("div");
          temp.innerHTML = html;
          const pieces = Array.from(temp.querySelectorAll("li, hr"));
          const target = document.getElementById("publications-list");
          target.innerHTML = "";
          pieces.reverse().forEach(node => {
            target.appendChild(node.cloneNode(true));
          });
          const typesetPublications = (attempts = 20) => {
            if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
              MathJax.startup.promise.then(() => MathJax.typesetPromise([target]));
            } else if (window.MathJax && MathJax.typesetPromise) {
              MathJax.typesetPromise([target]);
            } else if (attempts > 0) {
              window.setTimeout(() => typesetPublications(attempts - 1), 100);
            }
          };
          typesetPublications();
        });
    </script>
  </body>
</html>
