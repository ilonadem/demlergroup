[project]
name = "demler-publications"
version = "0.1.0"
description = "Reproducible migration pipeline for the Demler group publication list"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
pubs = "publication_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/publication_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]
